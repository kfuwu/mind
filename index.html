<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mind.</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');

        body {
            background-color: black;
            color: #e0e0e0;
            font-family: 'Fira Code', monospace;
            font-size: 1.2rem; 
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #journal-entries {
            flex-grow: 1;
            padding-bottom: 6rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .entry {
            margin-bottom: 3rem;
            opacity: 0.9;
            border-left: 2px solid #333;
            padding-left: 1.5rem;
        }

        .entry-content {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .entry img {
            max-width: 100%;
            border-radius: 4px;
            margin-top: 1rem;
        }

        .comments-section {
            margin-top: 1rem;
            font-size: 1rem;
            color: #888;
        }

        .comment {
            margin-top: 0.5rem;
        }

        .comment-author {
            color: #555;
            margin-right: 0.5rem;
        }

        /* Delete Buttons */
        .delete-btn {
            background: transparent;
            border: none;
            color: #555;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            margin-left: 0.5rem;
            padding: 0;
        }

        .delete-btn:hover {
            color: #ff5555;
        }

        /* Hidden by default for visitors */
        .delete-entry-btn {
            display: none;
        }

        /* Revealed only when logged in as Admin */
        body.is-admin .delete-entry-btn {
            display: inline-block;
        }

        .comment-button {
            background: transparent;
            border: none;
            color: #555;
            font-family: inherit;
            cursor: pointer;
            padding: 0;
            margin-top: 1rem;
        }
        
        .comment-button:hover { color: #fff; }

        .comment-input-container {
            display: none;
            margin-top: 0.5rem;
        }

        .comment-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #555;
            color: #888;
            font-family: inherit;
            outline: none;
            width: 100%;
            resize: none; 
            overflow: hidden; 
            padding: 0;
        }
        
        #prompt-container {
            display: none; 
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: black;
            padding: 1rem 2rem;
            align-items: center;
            border-top: 1px solid #333;
        }

        .entry-date {
            font-size: 0.8rem;
            color: #888; 
            margin-bottom: 0.5rem;
            font-family: inherit;
        }
        
        .prompt-symbol { color: #fff; margin-right: 1rem; font-weight: bold; }
        
        #command-line {
            background: transparent; 
            border: none; 
            color: white;
            font-family: inherit; 
            font-size: 1.5rem; 
            width: 100%; 
            outline: none;
            resize: none;       
            height: 2rem;       
            padding: 0;
        }
    </style>
</head>
<body>

    <div id="journal-entries"></div>

    <div id="prompt-container">
        <span class="prompt-symbol">>_</span>
        <textarea id="command-line" autocomplete="off" placeholder="enter."></textarea>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDxRqe3YEtMjp5H2X3YpinUdjp1XwanHmg",
            authDomain: "journal-7d381.firebaseapp.com",
            projectId: "journal-7d381",
            storageBucket: "journal-7d381.firebasestorage.app",
            messagingSenderId: "238066187526",
            appId: "1:238066187526:web:01d7831292ddfe95913287"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const journal = document.getElementById('journal-entries');
        const promptContainer = document.getElementById('prompt-container');
        const commandLine = document.getElementById('command-line');
        let isAdmin = false;

        // Unique device ID to identify comment creators without user accounts
        let myCommenterId = localStorage.getItem('mind_commenter_id');
        if (!myCommenterId) {
            myCommenterId = 'user_' + Math.random().toString(36).substring(2, 11);
            localStorage.setItem('mind_commenter_id', myCommenterId);
        }
        
        // 1. Admin Login (Ctrl+Shift+V)
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && (e.code === 'KeyV' || e.key.toLowerCase() === 'v')) {
                e.preventDefault();
                
                const password = prompt("ENTER SYSTEM OVERRIDE:");
                if (!password) return; 

                signInWithEmailAndPassword(auth, "god@mind.com", password)
                    .then(() => {
                        isAdmin = true;
                        document.body.classList.add('is-admin'); 
                        promptContainer.style.display = 'flex';
                        commandLine.focus();
                        console.log("Access Granted.");
                    })
                    .catch((error) => {
                        console.error("Auth Error:", error);
                        alert("ACCESS DENIED.");
                    });
            }
        });

        // 2. Fetch Data Live
        const q = query(collection(db, "entries"), orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
            const currentlyOpenId = document.querySelector('.comment-input-container[style*="display: block"]')?.getAttribute('id');
            journal.innerHTML = ''; 
            
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const entryId = docSnap.id;
                const entryDiv = document.createElement('div');
                entryDiv.className = 'entry';
                
                // Format Date
                let dateString = '';
                const d = data.createdAt ? data.createdAt.toDate() : new Date();
                const month = d.toLocaleDateString('en-US', { month: 'long' });
                const day = d.getDate();
                const year = d.getFullYear();
                const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                
                const suffix = (day % 10 === 1 && day !== 11) ? 'st' : 
                               (day % 10 === 2 && day !== 12) ? 'nd' : 
                               (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
                               
                dateString = `${month} ${day}${suffix}, ${year} ${time}`;

                // Format & Build Content HTML
                let contentHTML = '';

                if (data.type === 'image') {
                    contentHTML = `<img src="${data.content}" alt="image">`;
                } else {
                    const spotifyRegex = /https?:\/\/open\.spotify\.com\/track\/([a-zA-Z0-9]+)(\?[^\s]*)?/;
                    const match = data.content.match(spotifyRegex);

                    if (match) {
                        const trackId = match[1];
                        
                        let cleanText = data.content.replace(match[0], '').trim();
                        cleanText = cleanText.replace(/\n/g, '<br>');

                        const textHTML = cleanText !== '' 
                            ? `<div class="entry-content">${cleanText}</div>` 
                            : '';

                        const iframeHTML = `<iframe style="border-radius:12px; margin-top: 0.5rem; margin-bottom: 1rem;" src="https://open.spotify.com/embed/track/${trackId}?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;

                        contentHTML = textHTML + iframeHTML;
                    } else {
                        let displayContent = data.content.replace(/\n/g, '<br>');
                        contentHTML = `<div class="entry-content">${displayContent}</div>`;
                    }
                }

                // Render Structure
                entryDiv.innerHTML = `
                    <div class="entry-date">
                        ${dateString}
                        <button class="delete-btn delete-entry-btn" data-id="${entryId}">[delete]</button>
                    </div>
                    ${contentHTML}
                    <div class="comments-section" id="comments-${entryId}"></div>
                    <button class="comment-button" data-id="${entryId}">[ leave a note ]</button>
                    <div class="comment-input-container" id="input-container-${entryId}" style="display:none;">
                        <textarea class="comment-input" data-id="${entryId}" placeholder="type and press enter..."></textarea>
                    </div>
                `;
                journal.appendChild(entryDiv);

                if (currentlyOpenId === `input-container-${entryId}`) {
                    const container = entryDiv.querySelector(`#input-container-${entryId}`);
                    const btn = entryDiv.querySelector('.comment-button');
                    container.style.display = 'block';
                    btn.style.display = 'none';
                }

                // Fetch comments (Shows delete button ONLY if visitor owns comment OR user is Admin)
                const commentsQ = query(collection(db, "comments"), orderBy("createdAt", "asc"));
                onSnapshot(commentsQ, (commentSnapshot) => {
                    const commentsDiv = document.getElementById(`comments-${entryId}`);
                    if(commentsDiv) {
                        commentsDiv.innerHTML = '';
                        commentSnapshot.forEach((cDoc) => {
                            const cData = cDoc.data();
                            if(cData.entryId === entryId) {
                                const isOwner = cData.authorId === myCommenterId;
                                const showDelete = isOwner || isAdmin;
                                const deleteHTML = showDelete 
                                    ? `<button class="delete-btn delete-comment-btn" data-id="${cDoc.id}">[x]</button>` 
                                    : '';

                                commentsDiv.innerHTML += `
                                    <div class="comment">
                                        <span class="comment-author">user:</span> ${cData.text}
                                        ${deleteHTML}
                                    </div>`;
                            }
                        });
                    }
                });
            });
        });
        
        // 3. UI Interactions (Comments & Deletions)
        journal.addEventListener('click', async (e) => {
            // Delete Entry (Admin Only)
            if (e.target.classList.contains('delete-entry-btn')) {
                const id = e.target.getAttribute('data-id');
                if (confirm("Delete this entry?")) {
                    await deleteDoc(doc(db, "entries", id));
                }
            }

            // Delete Comment (Owner or Admin)
            if (e.target.classList.contains('delete-comment-btn')) {
                const id = e.target.getAttribute('data-id');
                await deleteDoc(doc(db, "comments", id));
            }

            // Open Comment Input
            if (e.target.classList.contains('comment-button')) {
                const id = e.target.getAttribute('data-id');
                const inputContainer = document.getElementById(`input-container-${id}`);
                inputContainer.style.display = 'block';
                inputContainer.querySelector('.comment-input').focus();
                e.target.style.display = 'none'; 
            }
        });

        // Submit Comment
        journal.addEventListener('keydown', async (e) => {
            if (e.target.classList.contains('comment-input')) {
                if (e.key === 'Enter') {
                    if (e.shiftKey) return; 
                    e.preventDefault(); 
                    
                    const id = e.target.getAttribute('data-id');
                    const text = e.target.value.trim();
                    
                    if (text !== '') {
                        await addDoc(collection(db, "comments"), {
                            entryId: id,
                            text: text,
                            authorId: myCommenterId, // Saves the device ID
                            createdAt: serverTimestamp()
                        });
                        
                        e.target.value = '';
                        const idContainer = document.getElementById(`input-container-${id}`);
                        const button = document.querySelector(`.comment-button[data-id="${id}"]`);
                        idContainer.style.display = 'none';
                        button.style.display = 'block'; 
                    }
                }
            }
        });

        // 4. Admin Command Line Logic
        commandLine.addEventListener('keydown', async function (e) {
            if (e.key === 'Enter') {
                if (e.shiftKey) return; 
                e.preventDefault(); 
                
                const input = this.value.trim();
                if (input !== '' && isAdmin) {
                    const isImage = input.match(/\.(jpeg|jpg|gif|png)$/i);
                    
                    await addDoc(collection(db, "entries"), {
                        type: isImage ? 'image' : 'text',
                        content: input,
                        createdAt: serverTimestamp()
                    });
                    this.value = ''; 
                }
            }
        });
    </script>
</body>
</html>
